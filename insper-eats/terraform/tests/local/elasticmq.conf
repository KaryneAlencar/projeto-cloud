# Emulador de SQS para o ensaio local: fila de pedidos com DLQ após 5
# recebimentos, como em messaging.tf.
include classpath("application.conf")

node-address { protocol = http, host = sqs, port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0" }

queues {
  insper-eats-local-orders {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue { name = "insper-eats-local-orders-dlq", maxReceiveCount = 5 }
  }
  insper-eats-local-orders-dlq { }
}
