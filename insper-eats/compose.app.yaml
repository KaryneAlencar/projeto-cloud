# Complementa compose.yaml sem alterar os arquivos da Pessoa 1.
services:
  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:?Execute scripts/start-local.ps1 primeiro}
    ports: ["127.0.0.1:${API_PORT:-8002}:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  chat:
    build: ./chat-service
    env_file: ./chat-service/.env
    environment:
      CHAT_DATABASE_URL: ${APP_DATABASE_URL:?Execute scripts/start-local.ps1 primeiro}
      ORDERS_API_URL: http://api:8000
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGINS: http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}
      WEB_CONCURRENCY: 2
    ports: ["127.0.0.1:${CHAT_PORT:-8003}:8001"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      CHAT_UPSTREAM: http://chat:8001
    ports: ["127.0.0.1:${FRONTEND_PORT:-8080}:8080"]
    depends_on:
      chat: {condition: service_healthy}
    restart: unless-stopped
